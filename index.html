<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.youtube.com; style-src 'self'; frame-src https://www.youtube.com; connect-src 'none'; img-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'">
  <title>Dante · Reproductor de YouTube</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main>
    <h1>YouTube</h1>
    <p class="intro">Reproductor oficial. Si no comienza, pulsa Reproducir o usa sus controles.</p>
    <div id="player-shell" class="player-shell"><div id="youtube-player"></div></div>
    <p id="player-status" role="status" aria-live="polite">Preparando el reproductor…</p>
    <div class="actions">
      <button id="play" type="button" disabled>Reproducir</button>
      <button id="close" type="button">Cerrar reproductor</button>
    </div>
    <p class="note">Esta página no captura la pantalla ni envía imágenes a los lentes.</p>
    <p id="page-origin" class="note"></p>
    <noscript>Activa JavaScript para utilizar el reproductor oficial de YouTube.</noscript>
  </main>
</body>
</html>
